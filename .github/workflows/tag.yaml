# Tag a new release using https://github.com/marketplace/actions/conventional-commits-versioner-action
#
# This is easier than having to run manual `git` operations on a local clone.
# It also runs on a schedule so we don't leave commits unreleased indefinitely
# (avoiding users having to ping "hey could someone cut a release").

name: Tag a Release
on:
  # Allow devs to tag manually through the GitHub UI.
  # For example after landing a fix that customers are waiting for.
  workflow_dispatch:

  # The twice-monthly schedule is parked until the first deliberate release
  # (v0.2.0) confirms ccv derives the next version from the intended baseline
  # tag. Re-enable after that release:
  #
  #   schedule:
  #     - cron: "0 15 1,15 * *"

  # WHILE THIS MODULE IS PRE-1.0, DO NOT DISPATCH THIS FOR A BREAKING CHANGE.
  # ccv has no 0.x special case: a `feat!:`/`fix!:` subject or a
  # `BREAKING CHANGE:` footer maps straight to IncMajor(), so a run over such
  # a commit tags v1.0.0 -- and the guard on the release job below then skips
  # the release, leaving a major tag with no artifacts behind it. Pre-1.0
  # breaking changes are released by pushing the intended minor tag by hand
  # (`git tag v0.3.0 && git push origin v0.3.0`), which release.yml picks up
  # on its own.

jobs:
  tag:
    permissions:
      contents: write # allow create tag
    runs-on: ubuntu-latest
    outputs:
      new-tag: ${{ steps.ccv.outputs.new-tag }}
      new-tag-version: ${{steps.ccv.outputs.new-tag-version}}
      # Referenced by the release job's major-version guard below; without
      # this forwarding the comparison saw an empty string and the guard
      # never fired.
      new-tag-version-type: ${{steps.ccv.outputs.new-tag-version-type}}
    steps:
      - uses: actions/checkout@v4
        with:
          # Need enough history to find the prior release tag
          fetch-depth: 0
      - name: Bump tag if necessary
        id: ccv
        uses: smlx/ccv@7318e2f25a52dcd550e75384b84983973251a1f8 # v0.10.0
  release:
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.tag.outputs.new-tag-version }}
    if: needs.tag.outputs.new-tag == 'true' && needs.tag.outputs.new-tag-version-type != 'major'
    # Must cover every permission release.yml declares: a called workflow
    # cannot exceed its caller's grant, and the mismatch fails the dispatch
    # at startup with no jobs or logs.
    permissions:
      contents: write # allow create release
      id-token: write # attest provenance
      attestations: write # attest provenance
